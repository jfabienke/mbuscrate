# Its own workspace root, as it was before mbus-core was split out. metermon-rs
# carries an optional path dependency on a sibling repo that is not always checked
# out; workspace members share dependency resolution, so joining the parent
# workspace would make a default build of this repo depend on a directory that may
# not exist.
[workspace]

[package]
name = "metermon-rs"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of the epulse `metermon` wM-Bus gateway, built on mbus-rs. A/B validation target against the deployed C++ metermon."

# Nested standalone crate, matching this repo's `examples/` convention
# (path-dep on the mbus-rs library at "..", not a workspace member).

[dependencies]
# The library under test. `crypto` is required for Mode 5/7/9 decryption.
mbus-rs = { path = "..", features = ["crypto"] }

# Shared wire contract for the MQTT LoRaWAN join-control protocol (arm/verify/status).
# Keys never cross these topics.
#
# Vendored into this repo (workspace member at ../lorawan-join-control), no longer a
# sibling directory outside it. The old `../../lorawan-join-control` path had no git
# remote behind it, so CI could not resolve it -- and because cargo resolves path
# dependencies even when the owning feature is off, that failed the whole build rather
# than just skipping this feature.
lorawan-join-control = { path = "../lorawan-join-control", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

# Direct SPI access for the read-only `dumpregs` diagnostic (Pi only).
rppal = { version = "0.22", optional = true }
redb = "4.1.0"

# The seeed-wm1302 radio driver stack — drives both the Waveshare SX1262 HAT and the
# incoming Seeed WM-1302 HAT from one API (wM-Bus RX is always on the SX1262; the SX1302
# is LoRaWAN-only). Pinned to a reviewed rev; the trait / RxFrame / GfskMeta shapes are
# stable-by-agreement with the seeed session (design/17). Linux/aarch64 only (radio-linux
# uses rppal), so these live behind the `seeed-radio` feature, which implies `radio`.
# Private repo: local + Pi have SSH access; mbuscrate CI needs a read deploy key.
radio-core = { git = "ssh://git@github.com/jfabienke/seeed-wm1302.git", rev = "1d5f3bf", optional = true }
radio-sx126x = { git = "ssh://git@github.com/jfabienke/seeed-wm1302.git", rev = "1d5f3bf", features = ["tx"], optional = true }
radio-boards = { git = "ssh://git@github.com/jfabienke/seeed-wm1302.git", rev = "1d5f3bf", optional = true }
radio-linux = { git = "ssh://git@github.com/jfabienke/seeed-wm1302.git", rev = "1d5f3bf", optional = true }
wmbus-link = { git = "ssh://git@github.com/jfabienke/seeed-wm1302.git", rev = "1d5f3bf", optional = true }

[features]
default = []
# The `radio` feature pulls in the RFM69 driver + Pi HAL. Only builds on Linux/aarch64
# (rppal is Linux-only), so it is OFF by default: the decode core, file-replay source,
# and MQTT publisher all build and test on any host without it.
radio = ["mbus-rs/rfm69", "mbus-rs/raspberry-pi", "dep:rppal"]
# The seeed-wm1302 driver backend (RadioSource::SeeedSx1262). Implies `radio` so the
# radio plumbing (RadioSource enum, source module) compiles; adds the seeed crates.
# Selected at runtime by `driver = "seeed"` in the device config so the legacy sx1262
# backend stays available as rollback during A/B validation.
seeed-radio = [
    "radio",
    "dep:radio-core", "dep:radio-sx126x", "dep:radio-boards", "dep:radio-linux", "dep:wmbus-link",
]
# The LoRaWAN join-control endpoint and its mock-backend driver. Pulls in the shared
# `lorawan-join-control` wire-schema crate (a sibling path dep, absent from repo CI) and
# implies `seeed-radio` because the gateway endpoint drives the RF join responder, which
# now runs on the seeed SX1262 driver (JoinResponder). The host-only backend driver
# (`join-control-backend`) is pure MQTT but lives behind this same feature because it
# needs the schema crate.
join-control = ["dep:lorawan-join-control", "seeed-radio"]
