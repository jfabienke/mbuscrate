# Cargo configuration for cross-compilation targets

[target.aarch64-unknown-linux-gnu]
# Raspberry Pi 4 (64-bit) / Raspberry Pi 5
# No `linker` here: aarch64-unknown-linux-gnu is the Pi's NATIVE host triple, so an
# unconditional linker override breaks builds on the Pi itself. When cross-compiling
# from another host, set CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER instead.
# Enable crypto extensions for Pi 5 (Cortex-A76).
# For Pi 4 (Cortex-A72), drop target-cpu to cortex-a72; +aes/+sha2 are still present.
# The flag is `target-feature` (singular) — `target-features` is not a rustc option
# and was previously being rejected, so these extensions never reached the compiler.
# This matters for RustCrypto's `aes`/`sha2`, which select their ARMv8 backends from it.
rustflags = [
    "-C", "target-cpu=cortex-a76",
    "-C", "target-feature=+aes,+sha2,+neon,+crc",
    "-C", "opt-level=3",
]

[target.armv7-unknown-linux-gnueabihf]
# Raspberry Pi 4 (32-bit) / Raspberry Pi 3/2/Zero
linker = "arm-linux-gnueabihf-gcc"

[target.arm-unknown-linux-gnueabihf]
# Raspberry Pi 1/Zero (original ARM11)
linker = "arm-linux-gnueabihf-gcc"

# Build optimizations for embedded targets.
# NOTE: `panic = "abort"` is deliberately absent. mbus-rs is a library; aborting on
# panic breaks unwinding for downstream consumers and makes `#[should_panic]` tests
# unrunnable. Set it in the *binary* crate that links this one if you want it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
overflow-checks = false
incremental = false
rpath = false

[profile.release-with-debug]
inherits = "release"
debug = true

# Cargo aliases for development.
# These belong here, not in Cargo.toml — an [alias] table in a manifest is ignored.
[alias]
bench-crypto = "bench --bench crypto_benchmark --features crypto"
bench-all = "bench --features crypto"
pio-demo = "run --example pio_irq_demo --features pio-irq"
pio-test = "test --test pio_irq_tests --features pio-irq"
