[workspace]
members = [".", "mbus-core", "lorawan-join-control"]
# metermon-rs stays OUT of the workspace, as it was before the split, because workspace
# members share dependency resolution and metermon-rs carries Linux-only radio deps.
#
# It used to be excluded for a second reason — an optional path dependency on a *sibling
# repo* that CI never checked out, which failed the build outright (cargo resolves path
# deps even when the feature is off). That reason is gone: `lorawan-join-control` is now
# vendored here as a subtree and is a workspace member, so it is always present.
# The panic probe is its own workspace: it needs `panic = "abort"` and a bare-metal
# target profile that must not apply to the host crates.
exclude = ["metermon-rs", "mbus-core/panic-probe"]

[package]
name = "mbus-rs"
version = "1.0.0"
authors = ["John Fabienke <jfabienke@arqitekta.com>"]
edition = "2021"
description = "A Rust crate for M-Bus (Meter-Bus) protocol communication"
repository = "https://github.com/jfabienke/mbus-rs"
license = "MIT"

[dependencies]
# Protocol core: no_std + alloc, no hardware, no OS, no clock. See mbus-core/src/lib.rs
# for the rule that keeps the split honest.
mbus-core = { path = "mbus-core", default-features = false, features = ["std", "crypto"] }
hex = "0.4"
# Fixed-capacity strings shared with mbus-core, for record fields the standard bounds.
heapless = "0.8"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
nom = "8.0"
proptest = "1.11"
tokio = { version = "1.53", features = ["full"] }
# serial2/serial2-tokio replace tokio-serial (→ serialport-rs, which drags in the
# GPL-3.0 `unescaper` + MPL-2.0 `serialport`). serial2 is BSD-2-Clause OR Apache-2.0
# with no serialport-rs dependency. Wired-M-Bus transport only (src/mbus/transport.rs).
serial2 = "0.2"
serial2-tokio = "0.1"
bytes = "1.12"
thiserror = "2.0"
async-trait = "0.1"
bitflags = "2.13"
once_cell = "1.21"
zeroize = { version = "1.9", features = ["derive"] }

# Enhanced crypto dependencies
aes = { version = "0.8", optional = true }
cipher = { version = "0.4", optional = true }
ctr = { version = "0.9", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
subtle = { version = "2.6", optional = true }
aes-gcm = { version = "0.10", optional = true }
cmac = { version = "0.7", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }

# Raspberry Pi HAL dependencies (optional)
rppal = { version = "0.22", optional = true }

# PIO IRQ dependencies for Pi 5
nix = { version = "0.31", optional = true }
libc = { version = "0.2", optional = true }

# RFM69 driver dependencies (optional)
crc = { version = "3.0", optional = true }

# Enhanced GPIO and logging dependencies
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# RTT + defmt logging dependencies for Pi
defmt = { version = "1.1", optional = true }
defmt-rtt = { version = "1.3", optional = true }
cortex-a = { version = "8.1", optional = true }
tock-registers = { version = "0.10", optional = true }
critical-section = { version = "1.2", features = ["std"], optional = true }

# Serialization for cache persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CBOR serialization for LoRa payloads
ciborium = "0.2"

# For per-device statistics
lazy_static = "1.4"

# For random channel selection in LoRa
rand = "0.10"

# For QUNDIS date/time handling
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
criterion = "0.8"
tokio-test = "0.4.5"
# Enables the paused virtual clock (`tokio::test(start_paused = true)`) used by the
# profile-scheduler tests to drive `sleep_until` deterministically, with no real waiting.
tokio = { version = "1.53", features = ["test-util"] }
tempfile = "3.27"

[[bench]]
name = "parsing_benchmark"
harness = false

[[bench]]
name = "crypto_benchmark"
harness = false

# Criterion benches must declare `harness = false` (they provide their own main via
# criterion_main!); otherwise the default libtest harness rejects Criterion CLI args like
# `--save-baseline` (as the enhanced-CI benchmark job hit for vif_benchmark).
[[bench]]
name = "vif_benchmark"
harness = false

[[bench]]
name = "edge_cases_benchmark"
harness = false

# Targets that depend on feature-gated symbols. Without these, `cargo test` and
# `cargo build --examples` fail on the default feature set because the RTT logging
# API only exists under `rtt-logging` (see src/logging.rs).
[[test]]
name = "lora_enhancements_test"
required-features = ["rtt-logging"]

[[example]]
name = "rtt_logging_demo"
required-features = ["rtt-logging"]

[[example]]
name = "pio_irq_demo"
required-features = ["pio-irq"]

# Its helpers (and inline #[test]s) are all `#[cfg(feature = "raspberry-pi")]`, so gate the
# whole example behind that feature — otherwise `cargo test --all-targets` fails to compile
# the example's tests on the default feature set.
[[example]]
name = "raspberry_pi_wmbus"
required-features = ["raspberry-pi"]

# NOTE: cargo aliases live in .cargo/config.toml, not here. An [alias] table in
# Cargo.toml is silently ignored ("unused manifest key: alias").

# Feature flags for platform support
[features]
default = ["crypto"]

# Platform support
raspberry-pi = ["rppal"]
raspberry-pi-4 = ["raspberry-pi"]
raspberry-pi-5 = ["raspberry-pi"]

# Hardware features
gpio-interrupt = ["raspberry-pi"]
hardware-spi = ["raspberry-pi"]
rfm69 = ["raspberry-pi", "crc"]

# PIO IRQ debouncing for Pi 5
pio-irq = ["dep:nix", "dep:libc"]

# Enhanced features for robust operation
crypto = ["dep:aes", "dep:cipher", "dep:ctr", "dep:cbc", "dep:aes-gcm", "dep:cmac", "dep:hmac", "dep:sha1", "dep:subtle"]
wmbus-crypto = ["crypto"]
enhanced-gpio = ["raspberry-pi", "dep:tracing"]
lorawan = []
tracing = ["dep:tracing"]
cbor = []

# RTT + defmt logging for Pi debugging
rtt-logging = ["dep:defmt", "dep:defmt-rtt", "dep:cortex-a", "dep:tock-registers", "dep:critical-section", "dep:tracing", "dep:tracing-subscriber"]
