[package]
name = "lorawan-join-control"
version = "0.1.0"
edition = "2021"
description = "Shared, transport-agnostic message schema for coordinating a LoRaWAN OTAA join between the optical device-config app and the RF gateway (metermon)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jfabienke/lorawan-join-control"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
