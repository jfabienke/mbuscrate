# cargo-deny configuration.
#
# License posture: EXPLICIT permissive allow-list (chosen 2026-08). Only the
# licenses below are accepted. Any dependency carrying a license outside this set
# must be reviewed per-crate before it is added — do NOT silently expand this list.
# This is the whole point of the "explicit" posture versus deny-by-exception.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
