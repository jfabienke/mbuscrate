name: Enhanced CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run intensive tests weekly
    - cron: '0 0 * * 0'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Portable enhanced-feature set for generic CI runners. We deliberately do NOT use
  # `--all-features`: `raspberry-pi` pulls `rppal` (Linux-target GPIO only) and `rtt-logging`
  # pulls `cortex-a` (bare-metal ARM, does not build on stable/x86_64). Those platform
  # features are exercised by the dedicated `pi-hardware` job and an ARM cross-build, not here.
  CI_FEATURES: crypto,cbor,lorawan,tracing

jobs:
  # Basic CI remains fast for PRs
  test:
    runs-on: ${{ matrix.os }}
    # beta is an early-warning signal (its clippy/rustc are ahead of stable and their
    # lints are a moving target), not a merge gate — keep the beta leg non-blocking so
    # a future beta-only lint never reddens master.
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only for the heavier enhanced build. Cross-platform coverage of the
        # default feature set lives in ci.yml; the platform-specific features
        # (raspberry-pi/rtt-logging) are covered by the pi-hardware job.
        os: [ubuntu-latest]
        rust: [stable, beta]
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy, rustfmt
    
    - uses: Swatinem/rust-cache@v2
    
    - name: Format check
      run: cargo fmt --all -- --check
    
    - name: Clippy
      run: cargo clippy --all-targets --features $CI_FEATURES -- -D warnings

    - name: Build
      run: cargo build --verbose --features $CI_FEATURES

    - name: Test
      run: cargo test --verbose --features $CI_FEATURES

    - name: Doc tests
      run: cargo test --doc --features $CI_FEATURES

  # Fuzzing - smoke test. Schedule-only: cargo-fuzz builds from source and each target
  # runs 30s+, too heavy/noisy for a per-push gate (deep-fuzz already runs weekly).
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@nightly
    
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false
    
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz
    
    - name: Fuzz frame parser (smoke test)
      run: |
        cd fuzz
        cargo +nightly fuzz run fuzz_parse_frame -- -max_total_time=30 -max_len=512
    
    - name: Fuzz VIF decoder (smoke test)
      run: |
        cd fuzz
        cargo +nightly fuzz run fuzz_vif_decode -- -max_total_time=30 -max_len=256
    
    - name: Fuzz data encoding (smoke test)
      run: |
        cd fuzz
        cargo +nightly fuzz run fuzz_data_encoding -- -max_total_time=30 -max_len=128
    
    - name: Upload fuzz artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts/

  # Benchmarks - schedule-only: criterion on shared runners is too noisy to gate, and
  # regression detection needs a persisted baseline CI does not keep. Record weekly.
  benchmark:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@stable
    
    - uses: Swatinem/rust-cache@v2
    
    - name: Install cargo-criterion
      run: cargo install cargo-criterion
    
    - name: Run benchmarks
      run: |
        cargo bench --bench parsing_benchmark -- --save-baseline current
        cargo bench --bench vif_benchmark -- --save-baseline current
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: target/criterion/
    
    - name: Check performance targets
      run: |
        # Regression gating needs a baseline persisted across runs (cache/artifact).
        # CI stores no "main" baseline, so `criterion --baseline main` errored and
        # hard-failed this job on every run. Until a baseline is persisted, record
        # results (see the benchmark-results artifact) without a false gate.
        echo "Benchmarks recorded; no persisted baseline available — regression gate skipped."

  # E2E tests with mocks
  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@stable
    
    - uses: Swatinem/rust-cache@v2
    
    - name: Run E2E tests
      run: cargo test --test e2e_scenarios -- --test-threads=1 --nocapture
    
    - name: Run integration tests
      run: cargo test --test '*_integration_*' --features $CI_FEATURES

  # Coverage analysis — informational, never a gate.
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - uses: Swatinem/rust-cache@v2

    # cargo-llvm-cov replaces the archived actions-rs/tarpaulin; taiki-e/install-action
    # fetches a prebuilt binary (no from-source install).
    - uses: taiki-e/install-action@cargo-llvm-cov

    - name: Coverage (lcov)
      run: cargo llvm-cov --features $CI_FEATURES --lcov --output-path lcov.info

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: lcov.info

    # Best-effort upload; a Codecov hiccup (or a missing token on a private repo) must
    # not fail the job. No hard threshold gate — coverage is a metric, not a gate.
    - name: Upload to Codecov
      continue-on-error: true
      uses: codecov/codecov-action@v5
      with:
        files: ./lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Mutation testing - weekly only due to time
  mutation:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[mutation]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-mutants
      run: cargo install cargo-mutants
    
    - name: Run mutation testing
      run: |
        cargo mutants --package mbus-rs \
          --file src/mbus/frame.rs \
          --file src/payload/vif.rs \
          --file src/payload/data_encoding.rs \
          --timeout 300 \
          --jobs 2
    
    - name: Upload mutation report
      uses: actions/upload-artifact@v4
      with:
        name: mutation-report
        path: mutants.out/

  # Security audit
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@stable
    
    # v2 bundles a current Cargo; v1 could not parse the v4 Cargo.lock and hard-failed.
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
        arguments: --all-features
    
    - name: Run cargo-audit
      run: |
        cargo install cargo-audit
        cargo audit

  # Deep fuzzing - weekly intensive run
  deep-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@nightly
    
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz
    
    - name: Deep fuzz all targets
      run: |
        cd fuzz
        for target in fuzz_parse_frame fuzz_vif_decode fuzz_data_encoding fuzz_multi_telegram; do
          echo "Deep fuzzing $target..."
          cargo +nightly fuzz run $target -- -max_total_time=3600 -max_len=1024 || true
        done
    
    - name: Minimize corpus
      run: |
        cd fuzz
        for target in fuzz_parse_frame fuzz_vif_decode fuzz_data_encoding fuzz_multi_telegram; do
          cargo +nightly fuzz cmin $target || true
        done
    
    - name: Upload corpus
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-corpus
        path: fuzz/corpus/

  # Optional: Raspberry Pi hardware test (self-hosted runner)
  pi-hardware:
    if: contains(github.event.head_commit.message, '[pi-test]')
    runs-on: [self-hosted, raspberry-pi]
    steps:
    - uses: actions/checkout@v4
    
    - name: Build for Pi
      run: |
        cargo build --release --features raspberry-pi --examples
    
    - name: Run Pi integration tests
      run: |
        cargo test --features raspberry-pi --test raspberry_pi_integration
    
    - name: Test examples
      run: |
        cargo run --example pi_quick_start --features raspberry-pi -- test

  # Release preparation
  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fuzz, benchmark, e2e, coverage, audit]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@stable
    
    - name: Check version
      run: |
        # Ensure Cargo.toml version matches tag
        VERSION=$(grep "^version" Cargo.toml | head -1 | cut -d'"' -f2)
        TAG=${GITHUB_REF#refs/tags/v}
        if [ "$VERSION" != "$TAG" ]; then
          echo "Version mismatch: Cargo.toml has $VERSION but tag is $TAG"
          exit 1
        fi
    
    - name: Dry run publish
      run: cargo publish --dry-run
    
    - name: Generate changelog
      run: |
        # Extract changelog for this version
        awk '/^## \['"$VERSION"'\]/,/^## \[/' CHANGELOG.md | head -n -1 > RELEASE_NOTES.md
    
    - name: Upload release notes
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: RELEASE_NOTES.md