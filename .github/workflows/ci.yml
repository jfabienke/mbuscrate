name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]        # required so the tag-gated `release` job can trigger
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - run: cargo fmt --all -- --check
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo test --verbose
    - name: Coverage
      if: matrix.os == 'ubuntu-latest'
      uses: actions-rs/tarpaulin@v0.1
      with:
        args: --ignore-tests --out Lcov

  # metermon-rs is a standalone (non-workspace) crate: the root `test` matrix runs at
  # the repo root and never formats, builds, or tests it — and its live gateway code
  # sits behind `--features radio` (rppal → Linux/aarch64 only, so it cannot build on
  # the macos/windows legs). This Ubuntu job is the only place metermon-rs, and the
  # root crate's Linux radio backends, are checked. It is what would have caught the
  # `JoinAdmission` import miss and the LoRa-rotation panic before they reached the Pi.
  radio-feature:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    # Compile-gate the Linux-only radio backends (RFM69 driver + Raspberry Pi HAL).
    # This is the check that caught the missing `no_dio2` method and the `JoinAdmission`
    # import miss — both compile errors that would otherwise have reached the Pi.
    # `-D warnings` is intentionally omitted for now: enabling it surfaced ~30 pre-existing
    # lints in never-linted radio code, most in the legacy RFM69 diagnostic scaffolding
    # (tracked as #10, to be cleaned on-device where the radio actually builds, not blind
    # via CI). Re-add `-- -D warnings` once #10 lands.
    - run: cargo clippy --features rfm69,raspberry-pi --all-targets
    # The standalone metermon-rs gateway: format-check + compile + test with the radio
    # path (monitor loop, SX1262/RFM69 sources, LoRaWAN responder) that only builds here.
    - name: metermon-rs (fmt + radio build + test)
      working-directory: metermon-rs
      run: |
        cargo fmt --all -- --check
        cargo clippy --features radio --all-targets
        cargo test   --features radio --verbose

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    # v2 bundles a current Cargo; v1 could not parse the v4 Cargo.lock and hard-failed.
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check

  release:
    needs: [test, audit]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo publish --token ${{ secrets.CRATES_TOKEN }}