name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]        # required so the tag-gated `release` job can trigger
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - run: cargo fmt --all -- --check
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo test --verbose
    # Coverage lives in the Enhanced CI `coverage` job (cargo-llvm-cov), not in this
    # fast per-platform correctness gate.

  # metermon-rs is a standalone (non-workspace) crate: the root `test` matrix runs at
  # the repo root and never formats, builds, or tests it — and its live gateway code
  # sits behind `--features radio` (rppal → Linux/aarch64 only, so it cannot build on
  # the macos/windows legs). This Ubuntu job is the only place metermon-rs, and the
  # root crate's Linux radio backends, are checked. It is what would have caught the
  # `JoinAdmission` import miss and the LoRa-rotation panic before they reached the Pi.
  radio-feature:
    runs-on: ubuntu-latest
    env:
      # cargo resolves metermon-rs's private `seeed-wm1302` git dependency (behind the
      # optional `seeed-radio` feature) even when the feature is off, so it must be
      # fetched with the git CLI, which honours the ~/.ssh/config written below.
      # libgit2's built-in fetch only tried ssh-agent and failed to authenticate.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
    - uses: actions/checkout@v4
    # Read access to the private seeed-wm1302 repo for the metermon-rs steps below. A
    # dedicated read-only deploy key on that repo is held in the SEEED_DEPLOY_KEY secret;
    # scoped to github.com with IdentitiesOnly so it is used only for that ssh fetch (the
    # mbuscrate checkout above is HTTPS via GITHUB_TOKEN, unaffected).
    - name: SSH key for the private seeed-wm1302 git dependency
      env:
        SEEED_DEPLOY_KEY: ${{ secrets.SEEED_DEPLOY_KEY }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$SEEED_DEPLOY_KEY" > ~/.ssh/seeed_ci
        chmod 600 ~/.ssh/seeed_ci
        printf 'Host github.com\n  IdentityFile ~/.ssh/seeed_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    # Full radio gate: the Linux-only radio backends (RFM69 driver + Pi HAL), at
    # -D warnings across all targets. This is what caught the missing `no_dio2` method
    # and the `JoinAdmission` import miss (compile errors) — and, with #10 landed, the
    # never-built radio code (driver lints, stale tests/examples rotted against the
    # get_info/gpio_read/GpioPins.nss API drift) is now clean, so the gate runs at full
    # strictness. Verified on-device (aarch64 Pi) where the radio actually builds.
    - run: cargo clippy --features rfm69,raspberry-pi --all-targets -- -D warnings
    # The standalone metermon-rs gateway: format + lint + test with the radio path
    # (monitor loop, SX1262/RFM69 sources, LoRaWAN responder) that only builds here.
    - name: metermon-rs (fmt + radio clippy + test)
      working-directory: metermon-rs
      run: |
        cargo fmt --all -- --check
        cargo clippy --features radio --all-targets -- -D warnings
        cargo test   --features radio --verbose
    # `join-control` on top of `radio`: the MQTT arm/verify endpoint and its wire
    # contract. This could not be built by any CI until the contract crate was vendored
    # into the workspace -- it was a path dep on a sibling repo with no git remote, which
    # failed the build outright rather than skipping the feature. Building it here is the
    # point of vendoring it; without this step the feature is exactly as unguarded as the
    # radio code was before the gate above existed.
    - name: metermon-rs (join-control)
      working-directory: metermon-rs
      run: |
        cargo clippy --features join-control --all-targets -- -D warnings
        cargo test   --features join-control --verbose

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    # v2 bundles a current Cargo; v1 could not parse the v4 Cargo.lock and hard-failed.
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check

  release:
    needs: [test, audit]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo publish --token ${{ secrets.CRATES_TOKEN }}

  # The no_std property is invisible to every other job: mbus-core builds fine on the
  # host whether or not it depends on std. Only a bare-metal target proves it, and
  # without this gate the property rots the first time someone adds a std dependency —
  # exactly how the radio-feature code rotted before it was gated.
  no-std-core:
    name: mbus-core builds for bare metal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Build mbus-core for thumbv6m-none-eabi (no_std + alloc)
        run: cargo build -p mbus-core --target thumbv6m-none-eabi --no-default-features --features crypto
      - name: mbus-core host tests
        run: cargo test -p mbus-core

      # Ratchet, not a pass/fail gate: fails if panic-freedom changes in EITHER direction,
      # so a regression cannot land silently and an improvement cannot land without
      # updating the recorded state. Currently records "can panic" -- see the probe's
      # README: that is a consequence of the API allocating, and only heapless removes it.
      - name: Panic-freedom ratchet
        run: ./mbus-core/panic-probe/check-panic-free.sh

      # Undeclared .rs files are invisible to rustc -- not dead code, simply not part of
      # the crate. Six accumulated here unnoticed over eleven months because no tool in
      # the pipeline had any reason to object.
      - name: No orphaned modules
        run: ./scripts/check-orphan-modules.sh
